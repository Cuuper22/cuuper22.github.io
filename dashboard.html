<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cuper Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;--red:#f38ba8;--green:#a6e3a1;--yellow:#f9e2af;--blue:#89b4fa}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--base);color:var(--text);overflow-x:hidden;padding-bottom:80px}.header{background:var(--mantle);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--surface0);position:sticky;top:0;z-index:100}.header-left{display:flex;align-items:center;gap:1rem}.header h1{font-size:1.25rem;font-weight:600}.sync-status{width:10px;height:10px;border-radius:50%;background:var(--green);transition:background .3s}.sync-status.syncing{background:var(--yellow)}.sync-status.error{background:var(--red)}.header-right{display:flex;align-items:center;gap:1rem}.sync-time{font-size:.75rem;color:var(--subtext0)}.btn{background:var(--surface0);color:var(--text);border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-size:.875rem;transition:background .2s}.btn:hover{background:var(--surface1)}.btn-primary{background:var(--blue);color:var(--base)}.btn-primary:hover{opacity:.9}.btn-danger{background:var(--red);color:var(--base)}.board{padding:1.5rem;overflow-x:auto}.columns{display:flex;gap:1rem;min-width:min-content}.column{flex:0 0 320px;background:var(--mantle);border-radius:8px;padding:1rem;max-height:calc(100vh - 200px);display:flex;flex-direction:column}.column-header{border-left:4px solid;padding-left:.75rem;margin-bottom:1rem;font-weight:600;font-size:.875rem;text-transform:uppercase;letter-spacing:.5px}.column-tasks{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem}.task-card{background:var(--surface0);border-radius:6px;padding:1rem;cursor:move;transition:transform .2s,box-shadow .2s;position:relative}.task-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}.task-card.dragging{opacity:.5}.task-title{font-weight:600;margin-bottom:.5rem;padding-right:2rem}.task-description{font-size:.875rem;color:var(--subtext0);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.task-priority{position:absolute;top:.75rem;right:.75rem;background:var(--surface1);color:var(--text);border-radius:4px;padding:.25rem .5rem;font-size:.75rem;font-weight:600}.fab{position:fixed;bottom:100px;right:2rem;width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--base);border:none;font-size:2rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .2s;z-index:90}.fab:hover{transform:scale(1.1)}.command-bar{position:fixed;bottom:0;left:0;right:0;background:var(--mantle);border-top:1px solid var(--surface0);padding:1rem 1.5rem;z-index:100}.command-input-wrapper{display:flex;gap:.5rem;align-items:center;position:relative}.command-badge{position:absolute;top:-8px;left:-8px;background:var(--red);color:var(--base);border-radius:50%;width:20px;height:20px;font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:600}.command-input{flex:1;background:var(--surface0);border:1px solid var(--surface1);color:var(--text);padding:.75rem;border-radius:6px;font-size:.875rem}.command-input::placeholder{color:var(--subtext0)}.command-input:focus{outline:none;border-color:var(--blue)}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:1rem}.modal.show{display:flex}.modal-content{background:var(--mantle);border-radius:8px;padding:1.5rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}.modal-title{font-size:1.25rem;font-weight:600}.close-btn{background:none;border:none;color:var(--subtext0);font-size:1.5rem;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}.close-btn:hover{color:var(--text)}.form-group{margin-bottom:1rem}.form-label{display:block;margin-bottom:.5rem;font-size:.875rem;font-weight:500;color:var(--subtext1)}.form-input,.form-textarea,.form-select{width:100%;background:var(--surface0);border:1px solid var(--surface1);color:var(--text);padding:.75rem;border-radius:6px;font-size:.875rem;font-family:inherit}.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--blue)}.form-textarea{resize:vertical;min-height:100px}.modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem}@media (max-width:768px){.columns{flex-direction:column}.column{flex:1 1 auto;max-height:none}.header h1{font-size:1rem}.sync-time{display:none}.fab{bottom:90px;right:1rem}}.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;font-size:1.25rem;color:var(--subtext0)}
</style>
</head>
<body>
<div class="header">
<div class="header-left">
<h1>Cuper Dashboard</h1>
<div class="sync-status" id="s"></div>
</div>
<div class="header-right">
<span class="sync-time" id="t"></span>
<button class="btn" id="r">Refresh</button>
<button class="btn" id="lo">Logout</button>
</div>
</div>
<div class="board">
<div class="columns" id="c"><div class="loading">Loading...</div></div>
</div>
<button class="fab" id="a">+</button>
<div class="command-bar">
<div class="command-input-wrapper">
<input type="text" class="command-input" id="ci" placeholder="Type a command for Claude Code..."/>
<button class="btn btn-primary" id="sc">Send</button>
</div>
</div>
<div class="modal" id="tm">
<div class="modal-content">
<div class="modal-header"><h2 class="modal-title">GitHub Token Required</h2></div>
<div class="form-group">
<label class="form-label">Enter your GitHub Personal Access Token</label>
<input type="password" class="form-input" id="ti" placeholder="ghp_...">
</div>
<div class="modal-actions"><button class="btn btn-primary" id="st">Save</button></div>
</div>
</div>
<div class="modal" id="tkm">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title" id="tmt">Add Task</h2>
<button class="close-btn" id="ct">&times;</button>
</div>
<form id="tf">
<div class="form-group">
<label class="form-label">Title</label>
<input type="text" class="form-input" id="tti" required>
</div>
<div class="form-group">
<label class="form-label">Description</label>
<textarea class="form-textarea" id="tdi"></textarea>
</div>
<div class="form-group">
<label class="form-label">Column</label>
<select class="form-select" id="tcs" required>
<option value="urgent">URGENT - Do Today</option>
<option value="high">HIGH - This Week</option>
<option value="medium">MEDIUM - This Month</option>
<option value="backlog">BACKLOG</option>
<option value="done">Done</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Priority</label>
<input type="number" class="form-input" id="tpi" min="1" value="1">
</div>
<div class="modal-actions">
<button type="button" class="btn btn-danger" id="dt" style="display:none">Delete</button>
<button type="button" class="btn" id="cct">Cancel</button>
<button type="submit" class="btn btn-primary">Save</button>
</div>
</form>
</div>
</div>
<script>
const G='171d19eaa5fbf902f53026df9c8a2792',F='tasks.json',U='https://api.github.com/gists/'+G,I=3e4;let k=null,d=null,e=null,l=null,g=null;const el={s:document.getElementById('s'),t:document.getElementById('t'),r:document.getElementById('r'),lo:document.getElementById('lo'),c:document.getElementById('c'),a:document.getElementById('a'),ci:document.getElementById('ci'),sc:document.getElementById('sc'),tm:document.getElementById('tm'),ti:document.getElementById('ti'),st:document.getElementById('st'),tkm:document.getElementById('tkm'),tmt:document.getElementById('tmt'),tf:document.getElementById('tf'),ct:document.getElementById('ct'),tti:document.getElementById('tti'),tdi:document.getElementById('tdi'),tcs:document.getElementById('tcs'),tpi:document.getElementById('tpi'),dt:document.getElementById('dt'),cct:document.getElementById('cct')};function init(){const p=new URLSearchParams(window.location.search),tp=p.get('token');tp?(k=tp,localStorage.setItem('github_pat',k)):k=localStorage.getItem('github_pat');k?loadData():el.tm.classList.add('show');el.r.addEventListener('click',loadData);el.lo.addEventListener('click',logout);el.a.addEventListener('click',()=>openTaskModal());el.sc.addEventListener('click',sendCommand);el.ci.addEventListener('keypress',ev=>{ev.key==='Enter'&&sendCommand()});el.st.addEventListener('click',saveToken);el.ct.addEventListener('click',closeTaskModal);el.cct.addEventListener('click',closeTaskModal);el.tf.addEventListener('submit',saveTask);el.dt.addEventListener('click',deleteTask);setInterval(updateSyncTimeDisplay,1e3);setInterval(loadData,I)}function saveToken(){const it=el.ti.value.trim();it&&(k=it,localStorage.setItem('github_pat',k),el.tm.classList.remove('show'),loadData())}function logout(){confirm('Logout?')&&(localStorage.removeItem('github_pat'),window.location.reload())}async function loadData(){setSyncStatus('syncing');try{const h={Authorization:'token '+k,Accept:'application/vnd.github.v3+json'};g&&(h['If-None-Match']=g);const res=await fetch(U,{headers:h});if(res.status===304){setSyncStatus('synced');updateSyncTime();return}if(!res.ok)throw new Error('API error');g=res.headers.get('ETag');const gist=await res.json();d=JSON.parse(gist.files[F].content);renderBoard();updateCommandBadge();setSyncStatus('synced');updateSyncTime()}catch(err){console.error(err);setSyncStatus('error');alert('Failed to load data')}}async function saveData(){setSyncStatus('syncing');try{const r1=await fetch(U,{headers:{Authorization:'token '+k,Accept:'application/vnd.github.v3+json'}});if(!r1.ok)throw new Error('Read failed');const et=r1.headers.get('ETag');d.lastUpdated=new Date().toISOString();const r2=await fetch(U,{method:'PATCH',headers:{Authorization:'token '+k,Accept:'application/vnd.github.v3+json','Content-Type':'application/json','If-Match':et},body:JSON.stringify({files:{[F]:{content:JSON.stringify(d,null,2)}}})});if(!r2.ok)throw new Error('Write failed');g=r2.headers.get('ETag');setSyncStatus('synced');updateSyncTime()}catch(err){console.error(err);setSyncStatus('error');alert('Save failed')}}function renderBoard(){if(!d||!d.columns)return;el.c.textContent='';Object.entries(d.columns).forEach(([id,cd])=>{const col=document.createElement('div');col.className='column';col.dataset.columnId=id;const hdr=document.createElement('div');hdr.className='column-header';hdr.style.borderLeftColor=cd.color;hdr.textContent=cd.title;const tks=document.createElement('div');tks.className='column-tasks';const cts=(d.tasks||[]).filter(t=>t.column===id).sort((a,b)=>a.priority-b.priority);cts.forEach(t=>{tks.appendChild(createTaskElement(t))});tks.addEventListener('dragover',ev=>ev.preventDefault());tks.addEventListener('drop',ev=>handleDrop(ev,id));col.appendChild(hdr);col.appendChild(tks);el.c.appendChild(col)})}function createTaskElement(task){const te=document.createElement('div');te.className='task-card';te.draggable=!0;te.dataset.taskId=task.id;const pe=document.createElement('div');pe.className='task-priority';pe.textContent=task.priority;const tle=document.createElement('div');tle.className='task-title';tle.textContent=task.title;te.appendChild(pe);te.appendChild(tle);if(task.description){const de=document.createElement('div');de.className='task-description';de.textContent=task.description;te.appendChild(de)}te.addEventListener('click',()=>openTaskModal(task));te.addEventListener('dragstart',()=>{te.dataset.dragging='1';te.classList.add('dragging')});te.addEventListener('dragend',()=>{delete te.dataset.dragging;te.classList.remove('dragging')});return te}function openTaskModal(task=null){e=task;if(task){el.tmt.textContent='Edit Task';el.tti.value=task.title;el.tdi.value=task.description||'';el.tcs.value=task.column;el.tpi.value=task.priority;el.dt.style.display='block'}else{el.tmt.textContent='Add Task';el.tti.value='';el.tdi.value='';el.tcs.value='urgent';el.tpi.value='1';el.dt.style.display='none'}el.tkm.classList.add('show')}function closeTaskModal(){el.tkm.classList.remove('show');e=null}async function saveTask(ev){ev.preventDefault();const td={title:el.tti.value.trim(),description:el.tdi.value.trim(),column:el.tcs.value,priority:parseInt(el.tpi.value)};if(!td.title)return;if(e){const i=d.tasks.findIndex(t=>t.id===e.id);i!==-1&&(d.tasks[i]=Object.assign({},d.tasks[i],td))}else{const nt=Object.assign({id:Date.now().toString()},td);d.tasks.push(nt)}await saveData();renderBoard();closeTaskModal()}async function deleteTask(){e&&confirm('Delete?')&&(d.tasks=d.tasks.filter(t=>t.id!==e.id),await saveData(),renderBoard(),closeTaskModal())}async function handleDrop(ev,tid){ev.preventDefault();const de=document.querySelector('.task-card[data-dragging="1"]');if(!de)return;const id=de.dataset.taskId,task=d.tasks.find(t=>t.id===id);task&&task.column!==tid&&(task.column=tid,await saveData(),renderBoard())}async function sendCommand(){const cmd=el.ci.value.trim();if(!cmd)return;d.commands||(d.commands=[]);d.commands.push({command:cmd,timestamp:new Date().toISOString(),status:'pending'});el.ci.value='';await saveData();updateCommandBadge()}function updateCommandBadge(){const pc=(d.commands||[]).filter(c=>c.status==='pending').length;let b=document.querySelector('.command-badge');if(pc>0){if(!b){b=document.createElement('div');b.className='command-badge';document.querySelector('.command-input-wrapper').appendChild(b)}b.textContent=pc}else b&&b.remove()}function setSyncStatus(st){el.s.className='sync-status';st!=='synced'&&el.s.classList.add(st)}function updateSyncTime(){l=Date.now();updateSyncTimeDisplay()}function updateSyncTimeDisplay(){if(!l)return;const sec=Math.floor((Date.now()-l)/1e3),txt=sec<60?sec+'s ago':Math.floor(sec/60)+'m ago';el.t.textContent='Last synced: '+txt}init();
</script>
</body>
</html>
